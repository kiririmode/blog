<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07a3f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f9b6e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="600" fill="#fbf8f3"/>

  <!-- タイトル -->
  <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#33394a">ぼくが話す相手は Chief エージェントだけ</text>

  <!-- ===== ぼく ===== -->
  <g transform="translate(95,300)">
    <circle cx="0" cy="-38" r="30" fill="#ffe2b8" stroke="#33394a" stroke-width="2.5"/>
    <circle cx="-10" cy="-42" r="3" fill="#33394a"/>
    <circle cx="10" cy="-42" r="3" fill="#33394a"/>
    <path d="M-10,-28 Q0,-20 10,-28" fill="none" stroke="#33394a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-38,40 Q-38,0 0,0 Q38,0 38,40 z" fill="#8fb8e8" stroke="#33394a" stroke-width="2.5"/>
    <text x="0" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#33394a">ぼく</text>
  </g>

  <!-- ===== Home Repo / Chief ===== -->
  <g filter="url(#shadow)">
    <rect x="215" y="105" width="330" height="410" rx="22" fill="#fff4d6" stroke="#e0b84f" stroke-width="2.5"/>
  </g>
  <text x="380" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a7413">🏠 Home Repo</text>

  <!-- Chief エージェント -->
  <g transform="translate(380,225)">
    <rect x="-120" y="-60" width="240" height="120" rx="18" fill="#ffffff" stroke="#e07a3f" stroke-width="2.5"/>
    <!-- 顔 -->
    <rect x="-100" y="-32" width="56" height="48" rx="12" fill="#ffd9c2" stroke="#33394a" stroke-width="2"/>
    <circle cx="-82" cy="-12" r="3" fill="#33394a"/>
    <circle cx="-62" cy="-12" r="3" fill="#33394a"/>
    <path d="M-82,2 Q-72,8 -62,2" fill="none" stroke="#33394a" stroke-width="2" stroke-linecap="round"/>
    <!-- 王冠 -->
    <path d="M-96,-34 L-92,-50 L-82,-40 L-72,-54 L-62,-40 L-52,-50 L-48,-34 z" fill="#f2c14e" stroke="#33394a" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="22" y="-14" text-anchor="middle" font-size="17" font-weight="bold" fill="#c4612a">Chief</text>
    <text x="22" y="8" text-anchor="middle" font-size="17" font-weight="bold" fill="#c4612a">エージェント</text>
    <text x="0" y="42" text-anchor="middle" font-size="13" fill="#5b6475">プロンプトを書く係</text>
  </g>

  <!-- 覚えていること -->
  <g transform="translate(380,345)">
    <rect x="-140" y="-28" width="280" height="56" rx="12" fill="#ffffff" stroke="#e0b84f" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="0" y="-5" text-anchor="middle" font-size="13.5" fill="#33394a">📝 誰に何を渡して、何が起きたか</text>
    <text x="0" y="16" text-anchor="middle" font-size="13.5" fill="#33394a">は Chief が覚えておく</text>
  </g>

  <!-- ポインタ -->
  <g transform="translate(380,440)">
    <text x="0" y="-20" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a7413">CLAUDE.md のポインタ（入口だけ）</text>
    <rect x="-130" y="-8" width="260" height="26" rx="8" fill="#ffffff" stroke="#e0b84f" stroke-width="1.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="12.5" fill="#5b6475" font-family="Menlo,Consolas,monospace">blog → ~/src/…/blog</text>
    <rect x="-130" y="24" width="260" height="26" rx="8" fill="#ffffff" stroke="#e0b84f" stroke-width="1.5"/>
    <text x="0" y="42" text-anchor="middle" font-size="12.5" fill="#5b6475" font-family="Menlo,Consolas,monospace">brain → ~/src/…/brain</text>
  </g>

  <!-- ===== herdr ウィンドウ ===== -->
  <g filter="url(#shadow)">
    <rect x="640" y="105" width="320" height="410" rx="16" fill="#2f3542" stroke="#2f3542" stroke-width="2"/>
  </g>
  <circle cx="662" cy="126" r="6" fill="#ff6b6b"/>
  <circle cx="682" cy="126" r="6" fill="#ffd93d"/>
  <circle cx="702" cy="126" r="6" fill="#6bcb77"/>
  <text x="800" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#e8ecf3">herdr</text>

  <!-- pane 1 -->
  <g transform="translate(800,205)">
    <rect x="-145" y="-50" width="290" height="100" rx="12" fill="#eaf6ef" stroke="#3f9b6e" stroke-width="2"/>
    <rect x="-130" y="-26" width="46" height="40" rx="10" fill="#c9ecd8" stroke="#33394a" stroke-width="2"/>
    <circle cx="-115" cy="-10" r="2.6" fill="#33394a"/>
    <circle cx="-99" cy="-10" r="2.6" fill="#33394a"/>
    <path d="M-115,2 Q-107,7 -99,2" fill="none" stroke="#33394a" stroke-width="2" stroke-linecap="round"/>
    <text x="-70" y="-12" font-size="15" font-weight="bold" fill="#2c7a54">Staff エージェント</text>
    <text x="-70" y="10" font-size="13" fill="#33394a">pane: <tspan font-weight="bold">blog</tspan> リポジトリ</text>
    <text x="-70" y="30" font-size="12" fill="#5b6475">ブログの下書きを書く</text>
  </g>

  <!-- pane 2 -->
  <g transform="translate(800,315)">
    <rect x="-145" y="-50" width="290" height="100" rx="12" fill="#eaf6ef" stroke="#3f9b6e" stroke-width="2"/>
    <rect x="-130" y="-26" width="46" height="40" rx="10" fill="#c9ecd8" stroke="#33394a" stroke-width="2"/>
    <circle cx="-115" cy="-10" r="2.6" fill="#33394a"/>
    <circle cx="-99" cy="-10" r="2.6" fill="#33394a"/>
    <path d="M-115,2 Q-107,7 -99,2" fill="none" stroke="#33394a" stroke-width="2" stroke-linecap="round"/>
    <text x="-70" y="-12" font-size="15" font-weight="bold" fill="#2c7a54">Staff エージェント</text>
    <text x="-70" y="10" font-size="13" fill="#33394a">pane: <tspan font-weight="bold">brain</tspan> リポジトリ</text>
    <text x="-70" y="30" font-size="12" fill="#5b6475">記事を文献ノートにする</text>
  </g>

  <!-- pane 3 -->
  <g transform="translate(800,425)">
    <rect x="-145" y="-50" width="290" height="100" rx="12" fill="#3a4152" stroke="#6b7489" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="14" fill="#c3c9d6">＋ 依頼が来るたびに</text>
    <text x="0" y="18" text-anchor="middle" font-size="14" fill="#c3c9d6">pane が増える</text>
  </g>

  <!-- ===== 矢印 ===== -->
  <!-- ぼく → Chief -->
  <path d="M140,250 C175,235 215,225 255,222" fill="none" stroke="#5b6475" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="120" y="182" width="120" height="44" rx="10" fill="#ffffff" stroke="#5b6475" stroke-width="1.5"/>
  <text x="180" y="200" text-anchor="middle" font-size="12.5" fill="#33394a">①短い依頼を</text>
  <text x="180" y="218" text-anchor="middle" font-size="12.5" fill="#33394a">話すだけ</text>

  <!-- Chief → Staff：プロンプト -->
  <path d="M502,200 C570,180 600,185 650,195" fill="none" stroke="#e07a3f" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="506" y="138" width="124" height="44" rx="10" fill="#ffffff" stroke="#e07a3f" stroke-width="1.5"/>
  <text x="568" y="156" text-anchor="middle" font-size="12.5" fill="#c4612a">②プロンプトを</text>
  <text x="568" y="174" text-anchor="middle" font-size="12.5" fill="#c4612a">書いて起動</text>

  <!-- Staff → Chief：報告 -->
  <path d="M650,320 C600,330 570,320 505,300" fill="none" stroke="#3f9b6e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <rect x="506" y="332" width="124" height="44" rx="10" fill="#ffffff" stroke="#3f9b6e" stroke-width="1.5"/>
  <text x="568" y="350" text-anchor="middle" font-size="12.5" fill="#2c7a54">③報告を</text>
  <text x="568" y="368" text-anchor="middle" font-size="12.5" fill="#2c7a54">回収する</text>

  <!-- Staff → ぼく：質問（下を回る） -->
  <path d="M700,475 C690,560 300,575 110,400" fill="none" stroke="#9aa3b5" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <rect x="360" y="535" width="250" height="34" rx="10" fill="#ffffff" stroke="#9aa3b5" stroke-width="1.5"/>
  <text x="485" y="557" text-anchor="middle" font-size="12.5" fill="#5b6475">ぼくが決めることだけ、直接質問が来る</text>
</svg>
